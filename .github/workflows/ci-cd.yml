name: NexusBio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f cheminformatics_sandbox/requirements.txt ]; then pip install -r cheminformatics_sandbox/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linter (Flake8)
        run: |
          flake8 cheminformatics_sandbox/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=cheminformatics_sandbox pytest cheminformatics_sandbox/tests/

  test-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install Infrastructure Dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Build & Validate CDK Stack
        working-directory: ./infrastructure
        run: npm run build

  deploy-aws:
    needs: [test-python, test-infrastructure]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/NexusBioGitHubActionRole
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Add your CDK deployment steps here