name: NexusBio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # JOB 1: Test Python Components & Sandbox
  # ==========================================
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          if [ -f cheminformatics_sandbox/requirements.txt ]; then pip install -r cheminformatics_sandbox/requirements.txt; fi
          if [ -f lambda_orchestrator/requirements.txt ]; then pip install -r lambda_orchestrator/requirements.txt; fi

      - name: Run Linter (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest cheminformatics_sandbox/tests/

  # ==========================================
  # JOB 2: Test Infrastructure (CDK & TypeScript)
  # ==========================================
  test-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install CDK Dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Run TypeScript Linter & Build
        working-directory: ./infrastructure
        run: |
          npm run build

  # ==========================================
  # JOB 3: Build, Push & Deploy (Only on Main)
  # ==========================================
  deploy-aws:
    needs: [test-python, test-infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Secure AWS Authentication using OIDC Role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/GitHubActionsNexusBioDeployRole
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Example: Build and Push Cheminformatics Sandbox Docker Image
      - name: Build, tag, and push Sandbox image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: nexusbio-sandbox
          IMAGE_TAG: latest
        working-directory: ./cheminformatics_sandbox
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Set up Node.js for CDK Deployment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install CDK Dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Deploy AWS CDK Stacks
        working-directory: ./infrastructure
        run: |
          npx cdk deploy --all --require-approval never
