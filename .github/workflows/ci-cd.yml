name: NexusBio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f cheminformatics_sandbox/requirements.txt ]; then pip install -r cheminformatics_sandbox/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linter (Flake8)
        run: |
          flake8 cheminformatics_sandbox/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest cheminformatics_sandbox/tests/

  deploy-azure:
    needs: [test-python]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.AZURE_REGISTRY_NAME }}

      - name: Build and Push Base RDKit Image to ACR
        working-directory: ./cheminformatics_sandbox
        run: |
          docker build -f Dockerfile.base -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/nexusbio-sandbox-base:latest .
          docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/nexusbio-sandbox-base:latest

      - name: Generate GitHub Actions Health Report Summary
        run: |
          echo "### NexusBio Pipeline Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Job | Status | Target / Environment |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Test Suite (`test-python`)** | Passing | Python 3.11 / Pytest / Flake8 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Azure Deployment (`deploy-azure`)** | Healthy | Azure Container Registry (`nexusbio`) |" >> $GITHUB_STEP_SUMMARY